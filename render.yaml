# Render Blueprint — deploys the Express backend as a free web service.
# In Render: New + > Blueprint > pick this repo. Then fill in the secret env vars it asks for
# (MONGO_URI, ADMIN_EMAIL, ADMIN_PASSWORD). Cloudinary keys can be added later under Environment.
services:
  - type: web
    name: medicare-clinic-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Colombo
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: System Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
